name: Generate Gallery Manifest

on:
  push:
    paths:
      - 'images/**'
      - '!images/manifest.json'

concurrency:
  group: gallery-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Video Thumbnails & JSON Manifest
        run: |
          cd images

          # Find all video files safely (handles spaces and casing)
          find . -maxdepth 1 -type f \( -iname "*.mp4" -o -iname "*.mov" -o -iname "*.webm" \) | while read -r video; do
            filename=$(basename "$video")
            thumb_name="${filename}_thumb.jpg"
            
            # Generate thumbnail at 0.5s if it doesn't already exist
            if [ ! -f "$thumb_name" ]; then
              ffmpeg -ss 00:00:00.500 -i "$filename" -vframes 1 -q:v 2 "$thumb_name" -y || true
            fi
          done

          # Generate manifest excluding manifest.json and thumbnail images
          ls -1 | grep -v 'manifest.json' | grep -v '_thumb.jpg' | grep -iE '\.(jpg|jpeg|png|webp|gif|mp4|mov|webm)$' | jq -R . | jq -s . > manifest.json

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add images/
          git commit -m "auto: update gallery manifest & video thumbnails" || exit 0
          git push
