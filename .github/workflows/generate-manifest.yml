name: Generate Gallery Manifest

on:
  push:
    paths:
      - 'images/**'
      - '!images/manifest.json'

concurrency:
  group: gallery-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Video Thumbnails & JSON Manifest
        run: |
          cd images

          # Loop through videos and create unique thumbnails (e.g. clip.mp4_thumb.jpg)
          for v in $(ls -1 | grep -iE '\.(mp4|mov|webm)$'); do
            thumb_name="${v}_thumb.jpg"
            if [ ! -f "$thumb_name" ]; then
              # Safe ffmpeg call with fallback suppression
              ffmpeg -ss 00:00:00.500 -i "$v" -vframes 1 -q:v 2 "$thumb_name" -y || true
            fi
          done

          # Exclude manifest.json and thumbnail files from the listing
          ls -1 | grep -v 'manifest.json' | grep -v '_thumb.jpg' | grep -iE '\.(jpg|jpeg|png|webp|gif|mp4|mov|webm)$' | jq -R . | jq -s . > manifest.json

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add images/
          git commit -m "auto: update gallery manifest & thumbnails" || exit 0
          git push
