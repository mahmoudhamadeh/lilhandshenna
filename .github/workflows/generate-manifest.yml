name: Generate Gallery Manifest

on:
  push:
    paths:
      - 'images/**'
      - '!images/manifest.json'
      - '!images/*_thumb.jpg'

concurrency:
  group: gallery-manifest-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: images

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Video Thumbnails
        run: |
          echo "=== Scanning for video files in $(pwd) ==="
          
          # Find all video files regardless of extension casing
          find . -maxdepth 1 -type f \( -iname "*.mp4" -o -iname "*.mov" -o -iname "*.webm" \) | while read -r video_path; do
            filename=$(basename "$video_path")
            thumb_name="${filename}_thumb.jpg"
            
            echo "Processing: $filename"
            
            if [ ! -f "$thumb_name" ]; then
              echo "--> Generating $thumb_name with ffmpeg..."
              ffmpeg -y -i "$filename" -ss 00:00:00.500 -vframes 1 -q:v 2 "$thumb_name" || ffmpeg -y -i "$filename" -vframes 1 -q:v 2 "$thumb_name"
            else
              echo "--> Thumbnail $thumb_name already exists."
            fi
          done

      - name: Generate JSON Manifest
        run: |
          echo "=== Generating manifest.json ==="
          # List all media files, exclude manifest.json and _thumb.jpg files
          ls -1 | grep -v 'manifest.json' | grep -v '_thumb.jpg' | grep -iE '\.(jpg|jpeg|png|webp|gif|mp4|mov|webm)$' | jq -R . | jq -s . > manifest.json
          cat manifest.json

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage manifest and all generated thumbnail images
          git add manifest.json
          git add *_thumb.jpg 2>/dev/null || true
          
          echo "=== Git Status before commit ==="
          git status
          
          git commit -m "auto: update gallery manifest & video thumbnails [skip ci]" || exit 0
          git push
