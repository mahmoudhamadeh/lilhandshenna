name: Generate Gallery Manifest

on:
  push:
    paths:
      - 'images/**'
      - '!images/manifest.json'

concurrency:
  group: gallery-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Video Thumbnails & JSON Manifest
        run: |
          cd images
          
          shopt -s nullglob nocaseglob
          
          for v in *.mp4 *.mov *.webm; do
            if [ -f "$v" ]; then
              thumb_name="${v}_thumb.jpg"
              echo "==> Found video: $v"
              
              if [ ! -f "$thumb_name" ]; then
                echo "--> Generating thumbnail for $v..."
                # Input FIRST (-i "$v"), then seek (-ss) for reliable mobile keyframe decoding
                ffmpeg -i "$v" -ss 00:00:00.100 -vframes 1 -q:v 2 "$thumb_name" -y || ffmpeg -i "$v" -vframes 1 -q:v 2 "$thumb_name" -y || echo "ffmpeg failed for $v"
              else
                echo "--> Thumbnail already exists for $v"
              fi
            fi
          done
          
          # Build manifest ignoring manifest.json and thumbnail files
          ls -1 | grep -v 'manifest.json' | grep -v '_thumb.jpg' | grep -iE '\.(jpg|jpeg|png|webp|gif|mp4|mov|webm)$' | jq -R . | jq -s . > manifest.json

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add images/
          git commit -m "auto: update gallery manifest & video thumbnails" || exit 0
          git push
