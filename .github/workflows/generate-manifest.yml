name: Generate Gallery Manifest

on:
  push:
    paths:
      - 'images/**'
      - '!images/manifest.json'
      - '!images/*_thumb.jpg'

concurrency:
  group: gallery-manifest-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: images

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: 1. Rename Raw Media Files to Timestamp Standard
        run: |
          echo "=== Step 1: Standardizing Filenames with Timestamp + Serial (_000) ==="
          
          find . -maxdepth 1 -type f \
            ! -name 'manifest.json' \
            ! -name '*_thumb.jpg' \
            \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" -o -iname "*.gif" -o -iname "*.mp4" -o -iname "*.mov" -o -iname "*.webm" \) | while read -r filepath; do
            
            filename=$(basename "$filepath")
            ext="${filename##*.}"
            lower_ext=$(echo "$ext" | tr '[:upper:]' '[:lower:]')
            
            # Skip if already named in YYYYMMDD_HHMMSS_XXX.ext format
            if [[ "$filename" =~ ^[0-9]{8}_[0-9]{6}_[0-9]{3}\.[a-zA-Z0-9]+$ ]]; then
              echo "--> Skipping $filename (already standardized)"
              continue
            fi

            # Extract file modification date as YYYYMMDD_HHMMSS
            timestamp=$(date -r "$filepath" +"%Y%m%d_%H%M%S")
            
            # Find next available serial number starting at _000
            serial=0
            formatted_serial=$(printf "%03d" $serial)
            new_name="${timestamp}_${formatted_serial}.${lower_ext}"
            
            while [ -f "$new_name" ]; do
              serial=$((serial + 1))
              formatted_serial=$(printf "%03d" $serial)
              new_name="${timestamp}_${formatted_serial}.${lower_ext}"
            done
            
            echo "--> Renaming: '$filename' -> '$new_name'"
            git mv "$filename" "$new_name" 2>/dev/null || mv "$filename" "$new_name"
          done

      - name: 2. Cleanup Orphaned Video Thumbnails
        run: |
          echo "=== Step 2: Cleaning up Orphaned Thumbnails ==="
          
          # Runs AFTER renaming so old thumbnails whose original files were renamed get purged properly
          find . -maxdepth 1 -type f -name '*_thumb.jpg' | while read -r thumb_path; do
            thumb_file=$(basename "$thumb_path")
            
            # Extract original video filename by removing '_thumb.jpg'
            original_video="${thumb_file%_thumb.jpg}"
            
            # If the original video no longer exists (deleted or renamed), purge the old thumbnail
            if [ ! -f "$original_video" ]; then
              echo "--> Video '$original_video' no longer exists. Deleting orphaned thumbnail '$thumb_file'..."
              git rm "$thumb_file" 2>/dev/null || rm "$thumb_file"
            fi
          done

      - name: 3. Generate Video Thumbnails
        run: |
          echo "=== Step 3: Generating Video Thumbnails ==="
          
          find . -maxdepth 1 -type f \( -iname "*.mp4" -o -iname "*.mov" -o -iname "*.webm" \) | while read -r video_path; do
            filename=$(basename "$video_path")
            thumb_name="${filename}_thumb.jpg"
            
            echo "Processing video: $filename"
            
            if [ ! -f "$thumb_name" ]; then
              echo "--> Generating $thumb_name with ffmpeg..."
              # Fallback chain ending in echo guarantees zero non-zero exit code returns to set -e
              ffmpeg -y -i "$filename" -ss 00:00:00.500 -vframes 1 -q:v 2 "$thumb_name" || \
              ffmpeg -y -i "$filename" -vframes 1 -q:v 2 "$thumb_name" || \
              echo "⚠️ Warning: FFmpeg could not process $filename (skipping thumbnail generation)"
            else
              echo "--> Thumbnail $thumb_name already exists."
            fi
          done

      - name: 4. Generate JSON Manifest
        run: |
          echo "=== Step 4: Generating manifest.json ==="
          ls -1 | grep -v 'manifest.json' | grep -v '_thumb.jpg' | grep -iE '\.(jpg|jpeg|png|webp|gif|mp4|mov|webm)$' | jq -R . | jq -s . > manifest.json
          cat manifest.json

      - name: 5. Commit and Push
        run: |
          echo "=== Step 5: Committing Changes ==="
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          # Notice: [skip ci] removed so Cloudflare processes this commit!
          git commit -m "auto: standardize filenames, cleanup old thumbs, update manifest" || exit 0
          git push
