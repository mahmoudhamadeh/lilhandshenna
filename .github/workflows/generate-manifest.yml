name: Generate Gallery Manifest

on:
  push:
    paths:
      - 'images/**'
      - '!images/manifest.json'

concurrency:
  group: gallery-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Video Thumbnails & JSON Manifest
        run: |
          cd images
          
          # Enable case-insensitive globbing
          shopt -s nullglob nocaseglob
          
          # Loop through ALL existing video files in the images folder
          for v in *.mp4 *.mov *.webm; do
            if [ -f "$v" ]; then
              thumb_name="${v}_thumb.jpg"
              echo "Processing video: $v -> $thumb_name"
              
              # Force ffmpeg thumbnail creation
              ffmpeg -y -ss 00:00:00.500 -i "$v" -vframes 1 -q:v 2 "$thumb_name" || true
            fi
          done
          
          # Build manifest ignoring manifest.json and _thumb.jpg files
          ls -1 | grep -v 'manifest.json' | grep -v '_thumb.jpg' | grep -iE '\.(jpg|jpeg|png|webp|gif|mp4|mov|webm)$' | jq -R . | jq -s . > manifest.json

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Explicitly add both manifest.json AND all generated _thumb.jpg files
          git add images/manifest.json
          git add images/*_thumb.jpg 2>/dev/null || true
          
          git commit -m "auto: update gallery manifest & video thumbnails" || exit 0
          git push
